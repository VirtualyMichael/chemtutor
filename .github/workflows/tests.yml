name: tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile everything
        run: python -m compileall -q app scripts chemtutor.py setup.py
      - name: Unit and server tests
        run: python -m unittest tests.test_learn tests.test_server tests.test_frq tests.test_generated tests.test_exams tests.test_hints tests.test_remote tests.test_aiconfig tests.test_launcher -v
      - name: Doctor
        run: python chemtutor.py doctor
        env:
          CHEMTUTOR_HOME: ${{ runner.temp }}/chemtutor-home
